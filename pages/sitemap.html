<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">

  <title>SnapWash | Sitemap</title>
  
  <link rel="stylesheet" href="../assets/css/variables.css">

  <link rel="stylesheet" href="../assets/css/components.css">
  
  <style>
    .page-header { padding: 150px 0 80px; text-align: center; background: linear-gradient(to bottom, var(--surface), var(--bg-color)); }
    .sitemap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 3rem; margin: 4rem 0; }
    .sitemap-col h3 { border-bottom: 2px solid var(--surface); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    .sitemap-list { display: flex; flex-direction: column; gap: 1rem; }
    .sitemap-list a { color: var(--text-color); font-weight: 500; }
    .sitemap-list a:hover { color: var(--accent); }
  </style>
</head>

    </div>

    </div>
  </header>

  <div class="container reveal">
    <div class="sitemap-grid">
      <div class="sitemap-col">
        <h3>Core Pages</h3>
        <div class="sitemap-list">
          <a href="../index.html">Home</a>
          <a href="../index-2.html">Home (Alternative)</a>
          <a href="about.html">About Us</a>
          <a href="services.html">Services & Pricing</a>
          <a href="contact.html">Contact Us</a>
        </div>
      </div>
      <div class="sitemap-col">
        <h3>Customer Portal</h3>

          <a href="signup.html">Apply for Membership</a>
          <a href="dashboard.html">Customer Dashboard</a>
        </div>
      </div>
      <div class="sitemap-col">

        <div class="sitemap-list">
          <a href="blog.html">The Journal (Blog)</a>
          <a href="blog-details.html">Blog Detail Example</a>
          <a href="privacy.html">Privacy Policy</a>
          <a href="terms.html">Terms & Conditions</a>
          <a href="404.html">404 Error Page</a>
          <a href="maintenance.html">Maintenance Page</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
