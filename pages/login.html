<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapWash | Sign In</title>
  
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  
  <style>
    .auth-container {
      display: flex;
      min-height: 100vh;
    }
    
    .auth-image {
      flex: 1;
      background: url('../assets/images/service_drycleaning_1786960683269.png') center/cover no-repeat;
      display: none;
    }
    
    .auth-form-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      background-color: var(--bg-color);
    }
    
    .auth-form {
      width: 100%;
      max-width: 400px;
    }
    
    .auth-title {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    
    @media (min-width: 992px) {
      .auth-image { display: block; }
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-image"></div>
    <div class="auth-form-wrapper">
      <div class="auth-form reveal">
        <a href="../index.html" class="logo" style="margin-bottom: 3rem; display: inline-flex;">
          <i class="ri-drop-fill text-accent"></i> Snap<span>Wash</span>
        </a>
        
        <h1 class="auth-title">Welcome Back</h1>
        <p class="text-muted" style="margin-bottom: 2.5rem;">Access your premium dashboard to schedule a pickup or track orders.</p>
        
        <form action="dashboard.html">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" placeholder="client@example.com" required>
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="form-label">Password</label>
              <a href="#" class="text-muted" style="font-size: 0.85rem;">Forgot Password?</a>
            </div>
            <input type="password" class="form-control" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>
        
        <p class="text-center text-muted" style="margin-top: 2rem;">
          Don't have an account? <a href="signup.html" class="text-accent" style="font-weight: 600;">Apply for Membership</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
